# vim:ft=kitty:fdm=marker
# Kitty config, symlinked into ~/.config/kitty by stow.
# Adapted from https://github.com/megalithic/dotfiles/blob/main/config/kitty/kitty.conf

# --[ fonts ] -------------------------------------------------------------- {{{
font_family                     JetBrainsMono Nerd Font Mono Regular
bold_font                       JetBrainsMono Nerd Font Mono ExtraBold
italic_font                     JetBrainsMono Nerd Font Mono Italic
bold_italic_font                JetBrainsMono Nerd Font Mono ExtraBold Italic
font_size                       18.0
modify_font                     cell_height 110%
disable_ligatures               cursor
# }}}

# --[ colors ] ------------------------------------------------------------- {{{
# Monokai Pro, same palette as tmux-monokai-pro
foreground                      #fcfcfa
background                      #2d2a2e
selection_foreground            #fcfcfa
selection_background            #5b595c
cursor                          #fcfcfa
cursor_text_color               #2d2a2e
url_color                       #78dce8
active_border_color             #727072
inactive_border_color           #403e41

color0                          #403e41
color1                          #ff6188
color2                          #a9dc76
color3                          #ffd866
color4                          #fc9867
color5                          #ab9df2
color6                          #78dce8
color7                          #fcfcfa
color8                          #727072
color9                          #ff6188
color10                         #a9dc76
color11                         #ffd866
color12                         #fc9867
color13                         #ab9df2
color14                         #78dce8
color15                         #fcfcfa
# }}}

# --[ mouse / scrollback ] ------------------------------------------------- {{{
copy_on_select                  yes
scrollback_lines                20000
mouse_hide_wait                 15
strip_trailing_spaces           never
url_style                       curly
# }}}

# --[ bells ] -------------------------------------------------------------- {{{
enable_audio_bell               no
window_alert_on_bell            no
visual_bell_duration            0.0
# }}}

# --[ windows ] ------------------------------------------------------------ {{{
remember_window_size            yes
enabled_layouts                 splits, stack
window_border_width             1.0
window_padding_width            10 5 0
draw_minimal_borders            yes
confirm_os_window_close         2
# }}}

# --[ tabs ] --------------------------------------------------------------- {{{
# Drawn by tab_bar.py (Monokai Pro, matches .tmux.conf). Changes to tab_bar.py
# need a full Kitty restart; reloading the config isn't enough.
# Rename a tab with the default set_tab_title shortcut (cmd+shift+i on macOS,
# ctrl+shift+alt+t on Linux); empty input restores the auto title.
tab_bar_style                   custom
tab_bar_min_tabs                1
tab_bar_edge                    bottom
tab_bar_align                   left
tab_bar_background              #403e41
tab_bar_margin_width            0.0
tab_bar_margin_height           0.0 0.0
tab_separator                   ""
tab_fade                        0 0 0 0
tab_activity_symbol             none
bell_on_tab                     no
# Always open the 3 predefined tabs (see startup.conf). Needs a full restart.
startup_session                 startup.conf
# }}}

# --[ keybinds ] ----------------------------------------------------------- {{{
map cmd+1                       goto_tab 1
map cmd+2                       goto_tab 2
map cmd+3                       goto_tab 3
map cmd+shift+]                 next_tab
map cmd+shift+[                 previous_tab
# }}}

# --[ shell ] -------------------------------------------------------------- {{{
shell                           .
shell_integration               enabled
editor                          nvim
# }}}

# --[ macOS ] -------------------------------------------------------------- {{{
hide_window_decorations         yes
macos_option_as_alt             yes
macos_quit_when_last_window_closed yes
macos_traditional_fullscreen    yes
macos_titlebar_color            background
# Homebrew binaries aren't on PATH when launched from the GUI
env PATH=/opt/homebrew/bin:/usr/local/bin:${PATH}
# }}}
